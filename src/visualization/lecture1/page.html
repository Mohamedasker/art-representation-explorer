<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture 1 · fish</title>
<style>
__STYLE__
</style></head>
<body>
<header>
  <h1>Lecture 1 &middot; fish</h1>
  <a class="home" href="../index.html">&#8962; overview</a>
  <nav id="tabs">
    <button data-tab="explore" class="on">Explore &middot; k-NN &middot; interpolation</button>
    <button data-tab="pca">PCA step by step</button>
    <button data-tab="tsne">t-SNE step by step</button>
    <button data-tab="umap">UMAP step by step</button>
  </nav>
  <span class="seg" title="How many numbers describe one fish">fish described by
    <button data-dim="2" class="on">2 numbers</button><button data-dim="3">3 numbers</button></span>
  <span class="seg" title="Which population of fish">fish population <select id="setsel" style="margin-left:8px"></select></span>
  <span class="sub" id="dimdesc"></span>
</header>

<section id="tab-explore" class="tab">
  <div class="toolbar">
    <span><label>Projection </label><select id="projsel"></select></span>
    <span><label>Colour by </label><select id="colorsel"></select></span>
    <span><label>Marker </label><select id="markersel"><option value="dot">dot</option><option value="fish">fish</option></select></span>
    <span><label>Mode </label><select id="modesel">
      <option value="explore">explore</option><option value="knn">nearest neighbours</option><option value="interp">interpolate A &rarr; B</option></select></span>
    <span class="modectl" id="knnctl" hidden><label>neighbours </label><input id="kk" type="range" min="1" max="20" value="6"><span id="kkv">6</span>
      <label>distance </label><select id="metricsel"><option value="raw">raw values (cm)</option><option value="std">standardised</option></select></span>
    <span class="modectl" id="interpctl" hidden><label>steps </label><input id="steps" type="range" min="3" max="11" value="7"><span id="stepsv">7</span>
      <button id="swapab">swap A/B</button><button id="clearab">reset</button></span>
    <span><label>Size </label><input id="size" type="range" min="2" max="12" step="0.5" value="5"></span>
  </div>
  <main class="expl">
    <div id="mapwrap"><canvas id="map"></canvas><div id="legend"></div>
      <div id="tip" hidden><canvas width="1" height="1"></canvas><span></span></div>
      <div id="busy" hidden>computing the map&hellip;</div>
      <div id="hint"></div></div>
    <aside>
      <div class="card" id="samplecard"><h2>Fish<span id="pin"></span></h2><div id="bigfish"></div><dl id="info"></dl></div>
      <div class="card" id="modecard" hidden><h2 id="modetitle"></h2><div id="modehelp"></div><div class="strip" id="strip"></div><div class="strip" id="strip2"></div></div>
      <div class="card"><h2>About this view</h2><div id="about"></div></div>
    </aside>
  </main>
</section>

<section id="tab-pca" class="tab" hidden></section>
<section id="tab-tsne" class="tab" hidden></section>
<section id="tab-umap" class="tab" hidden></section>
<div id="gtip" hidden><canvas width="1" height="1"></canvas><span></span></div>

<script>
const DATA = __DATA__;
</script>
<script>
__SCRIPTS__
</script>
</body></html>
